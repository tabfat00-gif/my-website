  <script>
    const SUPABASE_URL =
      "https://ulxreyrjtavflppahqlp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_L3HbgtTkYCPZmCnuEABRxw_t7qWHBAE";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const input = document.getElementById("searchInput");
    const resultsBox = document.getElementById("searchResults");
    const statusBox = document.getElementById("searchStatus");

    const pages = [
      { file: "index.html", name: "Home" },
      { file: "about.html", name: "About KaliMoh" },
      { file: "software.html", name: "Software" },
      { file: "pricing.html", name: "Categories" }
    ];

    function normalize(value) {
      return String(value || "")
        .toLocaleLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function makeResult(title, url, type, description) {
      const card = document.createElement("article");
      card.className = "result-card";

      const badge = document.createElement("span");
      badge.className = "result-type";
      badge.textContent = type;

      const heading = document.createElement("h3");
      const link = document.createElement("a");
      link.href = url;
      link.textContent = title;
      heading.appendChild(link);

      const paragraph = document.createElement("p");
      paragraph.textContent = description;

      card.append(badge, heading, paragraph);
      resultsBox.appendChild(card);
    }

    async function getPageResult(page, query) {
      try {
        const response = await fetch(page.file);

        if (!response.ok) {
          return null;
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        doc.querySelectorAll(
          "script, style, nav, header, footer, noscript"
        ).forEach(element => element.remove());

        const title =
          doc.querySelector("h1")?.textContent?.trim() ||
          doc.title ||
          page.name;

        const elements = [
          ...doc.querySelectorAll(
            "main h2, main h3, main p, main li, " +
            "section h2, section h3, section p, section li"
          )
        ];

        const text = elements
          .map(element => element.textContent.trim())
          .filter(Boolean)
          .join(" ");

        const searchable = normalize(title + " " + text);

        if (!searchable.includes(query)) {
          return null;
        }

        const index = searchable.indexOf(query);
        const start = Math.max(0, index - 70);
        const snippet = text
          ? text.slice(start, start + 220)
          : title;

        return {
          title,
          url: page.file,
          type: "Website page",
          description: snippet
        };
      } catch (error) {
        console.warn("Could not search page:", page.file, error);
        return null;
      }
    }

    async function getArticleResults(query) {
      const { data, error } = await supabaseClient
        .from("articles")
        .select("id, title, description, content, category")
        .eq("is_published", true)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Article search error:", error);
        return [];
      }

      return (data || [])
        .filter(article => {
          const text = normalize([
            article.title,
            article.description,
            article.content,
            article.category
          ].filter(Boolean).join(" "));

          return text.includes(query);
        })
        .map(article => ({
          title: article.title || "Untitled article",
          url: "blog-details.html?id=" + encodeURIComponent(article.id),
          type: "Article",
          description: article.description ||
            String(article.content || "").slice(0, 220) ||
            "Open this article to read more."
        }));
    }

    async function performSearch(term) {
      const originalTerm = term.trim();
      const query = normalize(originalTerm);

      resultsBox.replaceChildren();

      if (!query) {
        statusBox.textContent = "Enter a word to search KaliMoh.";
        return;
      }

      statusBox.textContent = "Searching KaliMoh...";
      const tasks = [
        ...pages.map(page => getPageResult(page, query)),
        getArticleResults(query)
      ];

      const responses = await Promise.allSettled(tasks);
      const results = [];

      for (const response of responses) {
        if (response.status !== "fulfilled") continue;

        if (Array.isArray(response.value)) {
          results.push(...response.value);
        } else if (response.value) {
          results.push(response.value);
        }
      }

      if (!results.length) {
        statusBox.textContent =
          'No results found for "' + originalTerm + '".';
        return;
      }

      statusBox.textContent =
        results.length + ' result(s) found for "' + originalTerm + '".';

      results.forEach(result => {
        makeResult(
          result.title,
          result.url,
          result.type,
          result.description
        );
      });
    }

    document.getElementById("searchForm").addEventListener(
      "submit",
      event => {
        event.preventDefault();

        const term = input.value.trim();
        const url = new URL(window.location.href);

        if (term) {
          url.searchParams.set("search", term);
        } else {
          url.searchParams.delete("search");
        }

        history.replaceState({}, "", url);
        performSearch(term);
      }
    );

    const params = new URLSearchParams(window.location.search);
    const initialSearch = params.get("search") || "";

    input.value = initialSearch;

    if (initialSearch.trim()) {
      performSearch(initialSearch);
    }
  </script>
