<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bexo | Profile</title>
  <meta name="robots" content="noindex, follow">

  <link
    rel="shortcut icon"
    href="assets/images/favicon.svg"
    type="image/svg"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .profile-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 30px;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .info {
      padding: 15px;
      margin-bottom: 15px;
      background: #f8f8f8;
      border-radius: 8px;
    }

    .label {
      display: block;
      color: #777;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 16px;
      font-weight: bold;
    }

    .password-box {
      padding: 20px;
      background: #f8f8f8;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .password-box input {
      width: 100%;
      padding: 11px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    .password-btn {
      border: 0;
      padding: 11px 18px;
      border-radius: 6px;
      cursor: pointer;
      background: #111;
      color: white;
      font-weight: bold;
    }

    .password-btn:disabled,
    .logout-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout-btn,
    .back-btn {
      border: 0;
      padding: 11px 18px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-right: 8px;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
    }

    .back-btn {
      background: #111;
      color: white;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    @media (max-width: 600px) {
      .container {
        margin: 30px auto;
        padding: 15px;
      }

      .profile-box {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="profile-box">
      <h1>My Profile</h1>

      <div class="info">
        <span class="label">Email</span>
        <span class="value" id="user-email">Loading...</span>
      </div>

      <div class="info">
        <span class="label">Account Created</span>
        <span class="value" id="account-created">Loading...</span>
      </div>

      <h2>Change Password</h2>

      <div class="password-box">
        <input
          type="password"
          id="new-password"
          placeholder="New password"
          autocomplete="new-password"
          aria-label="New password"
        >

        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm new password"
          autocomplete="new-password"
          aria-label="Confirm new password"
        >

        <button
          type="button"
          class="password-btn"
          id="change-password-btn"
        >
          Change Password
        </button>
      </div>

      <a href="index.html" class="back-btn">Back to Site</a>

      <button type="button" class="logout-btn" id="logout-btn">
        Logout
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL =
      "https://ulxreyrjtavflppahqlp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_L3HbgtTkYCPZmCnuEABRxw_t7qWHBAE";

    const userEmail = document.getElementById("user-email");
    const accountCreated = document.getElementById("account-created");
    const logoutBtn = document.getElementById("logout-btn");
    const changePasswordBtn = document.getElementById("change-password-btn");
    const newPassword = document.getElementById("new-password");
    const confirmPassword = document.getElementById("confirm-password");
    const message = document.getElementById("message");

    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || "";
    }

    async function loadProfile() {
      try {
        if (!supabaseClient) {
          throw new Error("The account service could not be loaded. Check your internet connection and reload the page.");
        }

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        const session = data?.session;
        if (!session) {
          window.location.href = "login.html";
          return;
        }

        const user = session.user;
        userEmail.textContent = user.email || "Unknown";

        accountCreated.textContent = user.created_at
          ? new Date(user.created_at).toLocaleDateString()
          : "Unknown";
      } catch (error) {
        console.error("Could not load profile:", error);
        userEmail.textContent = "Unavailable";
        accountCreated.textContent = "Unavailable";
        showMessage(
          error?.message || "Could not load your profile. Please reload the page.",
          "error"
        );
      }
    }

    changePasswordBtn.addEventListener("click", async () => {
      showMessage("", "");

      // Do not trim password values: spaces can be part of a user's password.
      const password = newPassword.value;
      const confirm = confirmPassword.value;

      if (!password || !confirm) {
        showMessage("Please enter and confirm your new password.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
      }

      if (password !== confirm) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      if (!supabaseClient) {
        showMessage("The account service could not be loaded. Check your internet connection and reload the page.", "error");
        return;
      }

      changePasswordBtn.disabled = true;
      changePasswordBtn.textContent = "Updating...";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        newPassword.value = "";
        confirmPassword.value = "";
        showMessage("Password changed successfully.", "success");
      } catch (error) {
        console.error("Password update failed:", error);
        showMessage(
          error?.message || "Password update failed. Please try again.",
          "error"
        );
      } finally {
        changePasswordBtn.disabled = false;
        changePasswordBtn.textContent = "Change Password";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      showMessage("", "");

      if (!supabaseClient) {
        showMessage("The account service could not be loaded. Check your internet connection and reload the page.", "error");
        return;
      }

      logoutBtn.disabled = true;
      logoutBtn.textContent = "Logging out...";

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;

        window.location.href = "login.html";
      } catch (error) {
        console.error("Logout failed:", error);
        showMessage(
          error?.message || "Logout failed. Please try again.",
          "error"
        );

        logoutBtn.disabled = false;
        logoutBtn.textContent = "Logout";
      }
    });

    loadProfile();
  </script>
</body>
</html>
