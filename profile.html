    }

    .logout-btn {
      background: #dc3545;
      color: white;
    }

      background: #111;

    }

    #message {
      margin-top: 15px;
      color: red;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {

  </div>

<script>

  const SUPABASE_URL =
    "https://ulxreyrjtavflppahqlp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_L3HbgtTkYCPZmCnuEABRxw_t7qWHBAE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const userEmail =
    document.getElementById(
      "user-email"
    );

  const accountCreated =
    document.getElementById(
      "account-created"
    );

  const logoutBtn =
    document.getElementById(
      "logout-btn"
    );

  const message =
    document.getElementById(
      "message"
    );


  async function loadProfile() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        "login.html";

      return;
    }


    const user =
      session.user;


    userEmail.textContent =
      user.email || "Unknown";


    if (user.created_at) {

      accountCreated.textContent =
        new Date(
          user.created_at
        ).toLocaleDateString();

    } else {

      accountCreated.textContent =
        "Unknown";

    }

  }


  logoutBtn.addEventListener(
    "click",
    async () => {

      logoutBtn.disabled =
        true;

      logoutBtn.textContent =
        "Logging out...";


      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Logout failed.";

        logoutBtn.disabled =
          false;

        logoutBtn.textContent =
          "Logout";

        return;
      }


      window.location.href =
        "login.html";

    }
  );


  loadProfile();

</script>

</body>
