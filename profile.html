<script>

  const SUPABASE_URL =
    "https://ulxreyrjtavflppahqlp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_L3HbgtTkYCPZmCnuEABRxw_t7qWHBAE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const userEmail =
    document.getElementById("user-email");

  const accountCreated =
    document.getElementById("account-created");

  const logoutBtn =
    document.getElementById("logout-btn");

  const changePasswordBtn =
    document.getElementById(
      "change-password-btn"
    );

  const newPassword =
    document.getElementById(
      "new-password"
    );

  const confirmPassword =
    document.getElementById(
      "confirm-password"
    );

  const message =
    document.getElementById("message");


  async function loadProfile() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        "login.html";

      return;
    }


    const user =
      session.user;


    userEmail.textContent =
      user.email || "Unknown";


    if (user.created_at) {

      accountCreated.textContent =
        new Date(
          user.created_at
        ).toLocaleDateString();

    } else {

      accountCreated.textContent =
        "Unknown";

    }

  }


  changePasswordBtn.addEventListener(
    "click",
    async () => {

      message.textContent = "";
      message.className = "";


      const password =
        newPassword.value.trim();

      const confirm =
        confirmPassword.value.trim();


      if (!password || !confirm) {

        message.textContent =
          "Please enter and confirm your new password.";

        message.className =
          "error";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.className =
          "error";

        return;
      }


      if (password !== confirm) {

        message.textContent =
          "Passwords do not match.";

        message.className =
          "error";

        return;
      }


      changePasswordBtn.disabled =
        true;

      changePasswordBtn.textContent =
        "Updating...";


      const {
        error
      } =
        await supabaseClient.auth.updateUser({
          password: password
        });


      if (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Password update failed.";

        message.className =
          "error";

        changePasswordBtn.disabled =
          false;

        changePasswordBtn.textContent =
          "Change Password";

        return;
      }


      newPassword.value = "";
      confirmPassword.value = "";


      message.textContent =
        "Password changed successfully.";

      message.className =
        "success";


      changePasswordBtn.disabled =
        false;

      changePasswordBtn.textContent =
        "Change Password";

    }
  );


  logoutBtn.addEventListener(
    "click",
    async () => {

      logoutBtn.disabled =
        true;

      logoutBtn.textContent =
        "Logging out...";


      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Logout failed.";

        message.className =
          "error";

        logoutBtn.disabled =
          false;

        logoutBtn.textContent =
          "Logout";

        return;
      }


      window.location.href =
        "login.html";

    }
  );


  loadProfile();

</script>
