
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KaliMoh | Admin Login</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #fff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .10);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #111;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 22px;
      color: #222;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:hover {
      opacity: .85;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #d00;
      font-size: 14px;
      min-height: 20px;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #111;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">KaliMoh</div>

    <div class="subtitle">
      Discover • Learn • Explore
    </div>

    <h1>Admin Login</h1>

    <form id="login-form">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="login-button">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back-link">
      ← Back to KaliMoh
    </a>

  </div>

<script>

const SUPABASE_URL =
  "https://ulxreyrjtavflppahqlp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_L3HbgtTkYCPZmCnuEABRxw_t7qWHBAE";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const form =
  document.getElementById("login-form");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("login-button");

const message =
  document.getElementById("message");


form.addEventListener("submit", async (event) => {

  event.preventDefault();

  message.textContent = "";
  loginButton.disabled = true;
  loginButton.textContent = "Logging in...";

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    message.textContent =
      error.message;

    loginButton.disabled = false;
    loginButton.textContent = "Login";

    return;
  }


  window.location.href =
    "admin.html";

});

</script>

</body>
</html>
```
