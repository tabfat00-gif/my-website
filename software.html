  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ulxreyrjtavflppahqlp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_L3HbgtTkYCPZmCnuEABRxw_t7qWHBAE";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadSoftware() {
      const softwareList = document.getElementById("software-list");

      const { data, error } = await supabaseClient
        .from("software")
        .select("*")
        .order("title", { ascending: true });

      if (error) {
        console.error("Supabase error:", error);
        softwareList.innerHTML = `
          <div class="col-lg-12 text-center">
            <p>Unable to load software.</p>
          </div>
        `;
        return;
      }

      if (!data || data.length === 0) {
        softwareList.innerHTML = `
          <div class="col-lg-12 text-center">
            <p>No software available yet.</p>
          </div>
        `;
        return;
      }

      softwareList.innerHTML = "";

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "col-lg-6 col-md-6";

        card.innerHTML = `
          <div class="ud-single-blog">
            <div class="ud-blog-content">

              <span class="ud-blog-date">
                ${item.category || "Software"}
              </span>

              <h3 class="ud-blog-title">
                ${item.title || ""}
              </h3>

              <p class="ud-blog-desc">
                ${item.description || ""}
              </p>

              ${
                item.download_url
                  ? `
                    <a
                      href="${item.download_url}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="ud-main-btn ud-white-btn">
                      Download
                    </a>
                  `
                  : ""
              }

            </div>
          </div>
        `;

        softwareList.appendChild(card);
      });
    }

    loadSoftware();
  </script>
